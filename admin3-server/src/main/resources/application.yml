spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  jpa:
    generate-ddl: true
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.auto_quote_keyword: true
  application:
    name: admin3
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/admin3?characterEncoding=utf8
    username: root
    password: 123456
  sql:
    init:
      encoding: utf8
      data-locations: classpath:data.sql
      mode: never
      continue-on-error: true
  data:
    web:
      pageable:
        one-indexed-parameters: true
  profiles:
    include: biz
server:
  servlet:
    context-path: /admin3
admin3:
  ocr:
    # 扫描件识别提供方：table=表格文字识别V2；doc-parser=文档解析（Unlimited-OCR）
    provider: doc-parser
    # doc-parser 原始解析结果存档目录，留空则不存档
    archive-dir: ./files/ocr-raw
    # 同一份 PDF 已有存档时直接复用，不再调用 OCR（forceOcr=true 时强制重新识别）
    reuse-cache: true
wechat:
  miniapp:
    # 微信小程序 AppID；AppSecret 通过环境变量注入，不要写进代码库
    appid: wx7ae4bc2cdb849451
    secret: ${WECHAT_MINIAPP_SECRET:}
